# fly.toml app configuration file generated for ask-the-papers on 2026-11-17T17:19:34+01:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'ask-the-papers'
primary_region = 'fra'

[env]
  RAG_PROFILE = "cloud"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"    # stop when idle, so you pay only while it runs
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
