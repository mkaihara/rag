- id: q06
  question: How many PlayStation 3 consoles did LACAL use to solve the 112-bit prime field ECDLP?
  answer: >-
    More than 215 PS3s (about 1300 SPUs). It took about half a year and was completed on
    July 8, 2009.
  evidence:
    - quotes:
        - "were run on LACAL’s cluster of more than 215 PS3s"
        - "On 1300 SPUs this resulted in more than half a million parallel walks"

- id: q07
  question: What is the birthday paradox, and why does it matter for Pollard's rho method?
  answer: >-
    23 randomly picked people give a better than 50% chance that two share a birthday.
    Drawing with replacement from N objects, a repeat is expected after about
    $\sqrt{\pi N/2}$ draws, so Pollard's rho expects a collision after about
    $\sqrt{\pi q/2}$ steps.
  evidence:
    - quotes: ["This is called the birthday paradox, not because it is a paradox"]
    - quotes: ["Because of the birthday paradox, after $\\sqrt{\\pi q/2}$ pairs a duplicate may be expected"]

- id: q08
  question: How does Pollard's rho method compute discrete logarithms?
  answer: >-
    It looks at $g^r y^s$ for random pairs $(r, s)$ (in practice a pseudo-random walk). By
    the birthday paradox a duplicate $g^r y^s = g^u y^v$ appears after about
    $\sqrt{\pi q/2}$ steps, giving $x = (r-u)/(v-s) \bmod q$. It parallelises with
    distinguished points.
  evidence:
    - quotes:
        - "looks at $g^r y^s$ in $G$ for random pairs $(r,s)$ of integers"
        - "Pollard’s rho method was designed to calculate discrete logarithms in multiplicative groups of prime fields"

- id: q09
  question: Did LACAL solve the 160-bit prime field ECDLP?
  answer: >-
    No. The paper estimates about $2.5 \cdot 10^9$ PS3 years (a year on 2.5 billion
    devices) and considers an open-community attack even by 2020 very unlikely. LACAL
    solved the 112-bit one.
  evidence:
    - quotes:
        - "a successful open community attack on 160-bit ECC even by the year 2020 must be considered very unlikely"
        - "PS3 years to crack 160-bit ECC"

- id: q10
  question: Was the 112-bit prime field ECDLP computation supported by Sony?
  answer: >-
    Not stated: neither paper says Sony supported it. The acknowledged support is the
    Swiss National Science Foundation, EPFL DIT and the EU ICT program ECRYPT II.
  evidence: []

- id: q11
  question: In which year was a 512-bit RSA modulus first factored?
  answer: 1999, with the Number Field Sieve.
  evidence:
    - quotes:
        - "1999: First factorization of a 512-bit RSA modulus"
        - "The first public announcement of the NFS-factorization of a 512-bit RSA modulus was in 1999"

- id: q12
  question: How does cracking 160-bit ECC compare with cracking 1024-bit RSA?
  answer: >-
    Cracking 160-bit ECC is at least three orders of magnitude harder. 160-bit ECC gives
    about 86-87 bits of security, 1024-bit RSA about 76 bits.
  evidence:
    - quotes: ["cracking 160-bit ECC is at least three orders of magnitude harder than cracking 1024-bit RSA"]
    - quotes: ["we find that 160-bit ECC provides between 86 and 87 bits of security"]

- id: q13
  question: Can the PlayStation 3's graphics card be used to solve the ECDLP?
  answer: >-
    Not at the time: with the hypervisor version then current it was not accessible to
    applications other than games. If it were accessible it could double a PS3's
    effectiveness.
  evidence:
    - quotes: ["not accessible to applications other than gaming"]

- id: q14
  question: What is the most effective published method for factoring an RSA modulus?
  answer: The Number Field Sieve (NFS).
  evidence:
    - quotes:
        - "The most effective method that has been published, the Number Field Sieve"
        - "For RSA moduli it is better to use NFS"

- id: q15
  question: >-
    Did the authors trade inversions for multiplications when computing point addition in
    affine Weierstrass representation?
  answer: >-
    Yes. With simultaneous inversion over N parallel walks, one inversion is shared at the
    cost of about 3 extra multiplications per walk, so a point addition takes four
    multiplications, one squaring and 1/N of an inversion for x, plus one multiplication
    for y. On the SPU they used N = 400.
  evidence:
    - quotes: ["using affine Weierstrass representation, point addition takes four multiplications, one squaring"]
