  question: Can the multiplier be split into more than two parts in Bipartite Modular Multiplication?
  answer: >-
    Not covered: the thesis only describes splitting the multiplier into two parts, $Y_H$
    and $Y_L$ (possibly of unequal length via $\alpha$). A good answer says the sources do
