# Evaluation questions: written by the author of the papers, reviewed
# against data/. The same questions are asked of every deployment.
#
#   answer    reference answer, for grading by hand
#   evidence  passages that answer the question. A retrieved source counts as
#             relevant to an item when its text contains one of the item's
#             quotes (after normalising case, whitespace, quotes and *_`).
#             Quotes are verbatim from data/<doc>/*.md. Empty evidence means
#             the papers do not answer the question: a good answer says so.
#             Alternatives cover passages that answer the same point in
#             another place (e.g. a definition and a side-by-side comparison).

- id: q01
  question: Why does Bipartite Modular Multiplication give the correct result?
  answer: >-
    In the KT-residue system the multiplier is split as $Y = Y_H r^{\alpha n} + Y_L$, and
    $X \circledast Y = (X Y_H \bmod M + X Y_L r^{-\alpha n} \bmod M) \bmod M$, which equals
    $X Y r^{-\alpha n} \bmod M$. The interleaved algorithm computes the $Y_H$ term and the
    Montgomery algorithm the $Y_L$ term, in parallel.
  evidence:
    - quotes:
        - "The correctness of the above formula can be seen using the following equality"
        - "Let us consider the multiplier $Y$ split into two parts"

- id: q02
  question: >-
    What is the difference between modular division based on the extended binary GCD algorithm
    and modular division based on the extended Euclidean algorithm?
  answer: >-
    The extended Euclidean algorithm reduces A and B through integer divisions (quotient q,
    A - qB); the extended binary GCD algorithm uses only halving of even values and
    subtraction of odd ones. Both apply the same operations to U and V modulo M. In the
    thesis the binary GCD divider is a radix-4/2 design (MQRTR) combined with Montgomery
    multiplication; the Euclidean one improves Takagi's divider by sharing the modular
    reduction hardware and also computes ordinary modular multiplication.
  evidence:
    - quotes: ["The Euclidean algorithm described below calculates the GCD of two integers through a series of integer divisions"]
    - quotes: ["The extended Binary GCD algorithm [Knuth, 1998b] is another efficient way of calculating modular division"]

- id: q03
  question: What is the difference between the Montgomery multiplication algorithm and the interleaved modular multiplication algorithm?
  answer: >-
    Interleaved modular multiplication computes $X Y \bmod M$, processing the multiplier from
    the most significant digit and estimating the quotient $\lfloor Z/M \rfloor$. Montgomery
    multiplication works on M-residues of an odd modulus, computes $X Y R^{-1} \bmod M$ and
    processes the multiplier from the least significant digit, choosing a multiple of M
    that makes Z divisible by r, with no carry propagation in the quotient. The two are
    symmetric.
  evidence:
    - quotes:
        - "In the algorithm, the digits of the multiplier are processed from the most significant position first"
        - "(Interleaved Mod. Mul. Algorithm) (Montgomery Algorithm)"
        - "If we compare these two algorithms, we can see that the multiplier $Y$ is processed from the most significant position"
    - quotes:
        - "in contrast to the interleaved modular multiplication algorithm, the multiplier can be processed in the reverse order"
        - "(Interleaved Mod. Mul. Algorithm) (Montgomery Algorithm)"
        - "If we compare these two algorithms, we can see that the multiplier $Y$ is processed from the most significant position"

- id: q04
  question: How does addition work in the binary signed-digit (SD2) representation?
  answer: >-
    Digits are in $\{\bar 1, 0, 1\}$. For each position an interim sum $h_i$ and a carry $c_i$
    are computed from $a_i, b_i$ and the preceding digits (Table 2.1), then
    $s_i = h_i + c_{i-1}$. There is no carry propagation and all digits are computed in
    parallel.
  evidence:
    - quotes: ["Addition of two SD2 numbers can be performed without carry propagation"]

